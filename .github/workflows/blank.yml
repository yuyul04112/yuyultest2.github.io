<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 에코랜드 곶자왈 도르라 트레일 런 8K | Run The Forest</title>
    <meta name="description" content="2026 에코랜드 스페셜 이벤트 — 제주 곶자왈 숲을 달리는 8K 이색 트레일 런. 2026년 6월 20일(토).">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #2E7D32;
            --accent-light: #66BB6A;
            --accent-glow: #A5D6A7;
            --accent-dark: #1B5E20;
            --bg: #0E1410;
            --bg-elev: #161E18;
            --bg-soft: #1E2620;
            --moss: #5D7B5F;
            --surface: #FAFAF7;
            --text: #14181A;
            --text-soft: #4A5550;
            --text-mute: #8B968F;
            --line: rgba(255,255,255,0.08);
            --line-dark: rgba(20, 24, 26, 0.08);
            --radius: 20px;
            --radius-lg: 28px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --container: 1280px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background: var(--surface);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        img { max-width: 100%; display: block; }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; cursor: pointer; border: none; background: none; }
        :focus-visible { outline: 2px solid var(--accent-light); outline-offset: 3px; border-radius: 4px; }

        .container { max-width: var(--container); margin: 0 auto; padding: 0 24px; }

        /* ===== Header ===== */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 18px 0;
            transition: all 0.4s var(--ease);
            background: transparent;
        }
        .header.scrolled {
            background: rgba(14, 20, 16, 0.7);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--line);
            padding: 12px 0;
        }
        .header-inner { display: flex; align-items: center; justify-content: space-between; }
        .logo {
            color: #fff; font-weight: 900;
            font-size: 1.05rem;
            display: flex; align-items: center; gap: 10px;
        }
        .logo-mark {
            width: 30px; height: 30px;
            border-radius: 50%;
            background: var(--accent-light);
            display: grid; place-items: center;
            font-size: 0.9rem; color: var(--bg); font-weight: 900;
        }
        .logo-text small {
            display: block; font-size: 0.65rem;
            font-weight: 500; color: var(--accent-glow);
            letter-spacing: 0.18em; margin-bottom: 2px;
        }
        .nav { display: flex; gap: 30px; align-items: center; }
        .nav a {
            color: rgba(255,255,255,0.85); font-weight: 500; font-size: 0.95rem;
            position: relative; transition: color 0.3s;
        }
        .nav a::after {
            content: ''; position: absolute;
            left: 0; bottom: -6px;
            width: 0; height: 2px;
            background: var(--accent-light);
            transition: width 0.3s var(--ease);
        }
        .nav a:hover { color: #fff; }
        .nav a:hover::after { width: 100%; }
        .nav-cta {
            padding: 10px 20px;
            background: var(--accent-light);
            color: var(--bg) !important;
            border-radius: 999px; font-weight: 700;
        }
        .nav-cta::after { display: none; }
        .nav-cta:hover { background: var(--accent-glow); transform: translateY(-1px); }

        .menu-toggle { display: none; width: 40px; height: 40px; color: #fff; position: relative; }
        .menu-toggle span {
            position: absolute; left: 8px;
            width: 24px; height: 2px; background: #fff;
            transition: all 0.3s;
        }
        .menu-toggle span:nth-child(1) { top: 14px; }
        .menu-toggle span:nth-child(2) { top: 20px; }
        .menu-toggle span:nth-child(3) { top: 26px; }
        .menu-toggle.active span:nth-child(1) { transform: rotate(45deg); top: 20px; }
        .menu-toggle.active span:nth-child(2) { opacity: 0; }
        .menu-toggle.active span:nth-child(3) { transform: rotate(-45deg); top: 20px; }

        /* ===== Hero ===== */
        .hero {
            position: relative; min-height: 100vh;
            color: #fff;
            background-color: #0E1410;
            overflow: hidden;
            display: flex; align-items: center;
        }
        .hero-bg {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
        }
        .hero-overlay {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 75% 35%, rgba(102, 187, 106, 0.28), transparent 60%),
                linear-gradient(180deg, rgba(14,20,16,0.55) 0%, rgba(14,20,16,0.92) 100%);
            z-index: 1;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
            opacity: 0.08; pointer-events: none; mix-blend-mode: overlay;
            z-index: 2;
        }
        .hero-content {
            position: relative; z-index: 3;
            width: 100%; padding: 140px 0 80px;
        }
        .hero-tag {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            font-size: 0.82rem; font-weight: 500;
            backdrop-filter: blur(10px);
            margin-bottom: 24px;
        }
        .hero-tag .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent-light);
            box-shadow: 0 0 12px var(--accent-light);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .hero-eyebrow {
            font-size: 0.78rem; font-weight: 700;
            color: var(--accent-glow);
            letter-spacing: 0.2em; text-transform: uppercase;
            margin-bottom: 18px;
        }
        .hero h1 {
            font-size: clamp(2.4rem, 6.8vw, 5.8rem);
            font-weight: 900; line-height: 1;
            letter-spacing: -0.025em;
            margin-bottom: 22px;
        }
        .hero h1 em {
            font-style: italic; font-weight: 900;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-light));
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero-sub {
            font-size: 0.92rem; color: var(--accent-glow);
            margin-bottom: 16px; letter-spacing: 0.05em;
        }
        .hero-sub::before { content: '※ '; opacity: 0.6; }
        .hero p.lead {
            font-size: clamp(1rem, 1.4vw, 1.15rem);
            max-width: 560px;
            color: rgba(255,255,255,0.82);
            margin-bottom: 36px;
        }
        .hero-cta { display: flex; gap: 16px; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 18px 32px; border-radius: 999px;
            font-weight: 700; font-size: 1rem;
            transition: all 0.3s var(--ease);
            white-space: nowrap;
        }
        .btn-primary { background: var(--accent-light); color: var(--bg); }
        .btn-primary:hover {
            background: var(--accent-glow);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 187, 106, 0.35);
        }
        .btn-ghost {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
        }
        .btn-ghost:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }
        .btn .arrow { transition: transform 0.3s var(--ease); }
        .btn:hover .arrow { transform: translateX(4px); }

        /* ===== BIG Countdown ===== */
        .countdown-wrap {
            margin-top: 64px;
            padding-top: 36px;
            border-top: 1px solid rgba(255,255,255,0.12);
        }
        .countdown-label-top {
            font-size: 0.78rem; font-weight: 700;
            color: var(--accent-glow);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            margin-bottom: 18px;
            display: flex; align-items: center; gap: 10px;
        }
        .countdown-label-top::before {
            content: ''; width: 30px; height: 1px; background: var(--accent-light);
        }
        .countdown {
            display: flex;
            gap: clamp(8px, 1.5vw, 18px);
            flex-wrap: wrap;
            align-items: stretch;
        }
        .countdown-item {
            flex: 1 1 0;
            min-width: 110px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: clamp(20px, 2.5vw, 32px) clamp(12px, 2vw, 24px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .countdown-item::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(165,214,167,0.08), transparent 70%);
            pointer-events: none;
        }
        .countdown-num {
            font-family: 'Inter';
            font-size: clamp(3.2rem, 7vw, 5.5rem);
            font-weight: 900;
            color: #fff;
            line-height: 1;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
            display: inline-block;
        }
        .countdown-num.flip { animation: numFlip 0.4s var(--ease); }
        @keyframes numFlip {
            0% { opacity: 0.4; transform: translateY(-6px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .countdown-label {
            font-size: clamp(0.7rem, 1vw, 0.82rem);
            color: rgba(255,255,255,0.6);
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-top: 14px;
            font-weight: 600;
        }
        .countdown-sep {
            display: flex; align-items: center;
            font-size: clamp(2.4rem, 5vw, 4rem);
            font-weight: 300;
            color: rgba(255,255,255,0.25);
            line-height: 1;
            padding-bottom: 30px;
        }

        /* ===== Section base ===== */
        section { scroll-margin-top: 80px; }
        .section { padding: clamp(80px, 12vw, 140px) 0; }
        .section-dark { background: var(--bg); color: #fff; }
        .section-soft { background: #F1EFE9; }
        .section-head { margin-bottom: 64px; max-width: 720px; }
        .section-head.center { margin-left: auto; margin-right: auto; text-align: center; }
        .eyebrow {
            display: inline-block; font-size: 0.78rem; font-weight: 700;
            color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.2em;
            margin-bottom: 16px;
        }
        .section-dark .eyebrow { color: var(--accent-glow); }
        .section-title {
            font-size: clamp(2rem, 4vw, 3.2rem);
            font-weight: 900; line-height: 1.12;
            letter-spacing: -0.02em; margin-bottom: 18px;
        }
        .section-title em { font-style: italic; color: var(--accent); }
        .section-dark .section-title em { color: var(--accent-light); }
        .section-desc { color: var(--text-soft); font-size: 1.05rem; }
        .section-dark .section-desc { color: rgba(255,255,255,0.65); }

        /* ===== Info grid ===== */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
        }
        .info-card {
            padding: 32px;
            border-radius: var(--radius);
            background: #fff;
            border: 1px solid var(--line-dark);
            transition: all 0.4s var(--ease);
        }
        .info-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border-color: var(--accent-light);
        }
        .info-icon {
            width: 46px; height: 46px;
            border-radius: 12px;
            background: rgba(46, 125, 50, 0.1);
            color: var(--accent);
            display: grid; place-items: center;
            margin-bottom: 22px;
            font-size: 1.3rem;
        }
        .info-card h3 {
            font-size: 0.78rem; color: var(--text-mute);
            font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.12em; margin-bottom: 10px;
        }
        .info-card .info-value {
            font-size: 1.3rem; font-weight: 800;
            line-height: 1.3; color: var(--text);
        }
        .info-card .info-sub {
            margin-top: 6px; color: var(--text-soft);
            font-size: 0.92rem;
        }

        /* ===== Course ===== */
        .course-hero {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: start;
        }
        .course-visual {
            position: sticky;
            top: 100px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            aspect-ratio: 4/5;
            background-color: #1E2620;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .course-visual::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(14,20,16,0.7) 100%);
        }
        .course-badge {
            position: absolute; top: 28px; left: 28px; z-index: 2;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            color: #fff; font-size: 0.82rem; font-weight: 700;
        }
        .course-stat-row {
            position: absolute;
            left: 28px; right: 28px; bottom: 28px; z-index: 2;
            display: flex; justify-content: space-between;
            color: #fff;
        }
        .course-stat-row > div { font-size: 0.78rem; color: rgba(255,255,255,0.7); }
        .course-stat-row > div strong {
            display: block; color: #fff;
            font-size: 1.6rem; font-weight: 900;
            margin-top: 2px;
        }
        .course-hint {
            margin-top: 20px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.04);
            border: 1px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.65);
            text-align: center;
        }
        .course-hint strong { color: var(--accent-glow); }

        /* Route + popup */
        .route { list-style: none; counter-reset: stop; position: relative; }
        .route::before {
            content: '';
            position: absolute;
            left: 19px; top: 14px; bottom: 14px;
            width: 2px;
            background: linear-gradient(180deg, var(--accent-light), var(--moss) 50%, var(--accent-light));
            opacity: 0.35;
        }
        .route li {
            position: relative;
            padding: 14px 0 14px 56px;
            counter-increment: stop;
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.92);
            cursor: pointer;
            transition: transform 0.3s var(--ease);
        }
        .route li:hover { transform: translateX(8px); }
        .route li::before {
            content: counter(stop, decimal-leading-zero);
            position: absolute;
            left: 0; top: 50%;
            transform: translateY(-50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            background: var(--bg-elev);
            border: 1px solid var(--line);
            display: grid; place-items: center;
            font-size: 0.78rem; font-weight: 700;
            color: var(--accent-glow);
            font-family: 'Inter';
            transition: all 0.3s var(--ease);
        }
        .route li:hover::before {
            background: var(--accent);
            border-color: var(--accent-light);
            color: #fff;
            box-shadow: 0 0 0 6px rgba(102,187,106,0.15);
        }
        .route li.is-start::before, .route li.is-finish::before {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .route li small {
            display: block;
            font-weight: 500; font-size: 0.82rem;
            color: rgba(255,255,255,0.45);
            margin-top: 2px;
        }

        /* Popup — PC 50% bigger */
        .stop-popup {
            position: absolute;
            left: calc(100% + 28px);
            top: 50%;
            transform: translateY(-50%) translateX(-12px);
            width: 420px;
            background: var(--bg-elev);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s var(--ease), transform 0.4s var(--ease);
            z-index: 10;
            box-shadow: 0 24px 60px rgba(0,0,0,0.55);
        }
        .stop-popup::before {
            content: '';
            position: absolute;
            left: -8px; top: 50%;
            transform: translateY(-50%) rotate(45deg);
            width: 16px; height: 16px;
            background: var(--bg-elev);
            border-left: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }
        .route li:hover .stop-popup,
        .route li.show-popup .stop-popup {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            pointer-events: auto;
        }
        .stop-popup-img {
            width: 100%;
            aspect-ratio: 16/10;
            background-size: cover;
            background-position: center;
            background-color: #1E2620;
        }
        .stop-popup-body {
            padding: 20px 24px 22px;
        }
        .stop-popup-body h4 {
            font-size: 1.15rem; font-weight: 800;
            color: #fff; margin-bottom: 6px;
        }
        .stop-popup-body p {
            font-size: 0.92rem;
            color: rgba(255,255,255,0.65);
            line-height: 1.55;
        }

        /* ===== Awards ===== */
        .awards-hero {
            margin-bottom: 50px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            position: relative;
            aspect-ratio: 21/9;
            background-color: #1E2620;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .awards-hero::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(90deg, rgba(14,20,16,0.85) 0%, rgba(14,20,16,0.3) 60%, transparent 100%);
        }
        .awards-hero-text {
            position: absolute;
            left: clamp(28px, 5vw, 60px);
            bottom: clamp(28px, 5vw, 50px);
            color: #fff;
            z-index: 2;
            max-width: 460px;
        }
        .awards-hero-text span {
            display: inline-block;
            padding: 6px 14px;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            font-size: 0.75rem; font-weight: 700;
            color: var(--accent-glow);
            letter-spacing: 0.12em;
            margin-bottom: 16px;
        }
        .awards-hero-text h3 {
            font-size: clamp(1.3rem, 2.4vw, 2rem);
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: -0.01em;
        }
        .awards-hero-text h3 em { font-style: italic; color: var(--accent-light); }

        .awards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }
        .award-card {
            position: relative;
            padding: 40px 32px;
            border-radius: var(--radius);
            background: #fff;
            border: 1px solid var(--line-dark);
            overflow: hidden;
            transition: transform 0.4s var(--ease);
        }
        .award-card:hover { transform: translateY(-6px); }
        .award-card.gold { background: linear-gradient(160deg, #FFF8E1 0%, #fff 60%); border-color: #E6C76A; }
        .award-card.silver { background: linear-gradient(160deg, #F4F4F4 0%, #fff 60%); border-color: #C9C9C9; }
        .award-card.bronze { background: linear-gradient(160deg, #F8E6D8 0%, #fff 60%); border-color: #C68B5E; }
        .award-rank {
            font-family: 'Inter';
            font-size: 0.8rem; font-weight: 800;
            letter-spacing: 0.15em;
            color: var(--text-mute);
            margin-bottom: 14px;
        }
        .gold .award-rank { color: #B8860B; }
        .silver .award-rank { color: #6E6E6E; }
        .bronze .award-rank { color: #A0522D; }
        .award-medal { font-size: 2.4rem; margin-bottom: 16px; line-height: 1; }
        .award-card h3 {
            font-size: 1.2rem; font-weight: 800;
            line-height: 1.35; margin-bottom: 8px;
        }
        .award-card p { font-size: 0.92rem; color: var(--text-soft); }
        .award-count {
            position: absolute; top: 24px; right: 28px;
            font-size: 0.75rem; font-weight: 700;
            color: var(--text-mute);
            text-transform: uppercase; letter-spacing: 0.1em;
        }
        .lottery {
            padding: 40px;
            border-radius: var(--radius);
            background: var(--bg-elev);
            color: #fff;
            border: 1px solid var(--line);
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            align-items: center;
        }
        .lottery h3 { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; }
        .lottery h3 em { color: var(--accent-light); font-style: italic; }
        .lottery > div:first-child p { color: rgba(255,255,255,0.6); font-size: 0.92rem; }
        .lottery-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }
        .lottery-list div {
            padding: 16px;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: center;
        }
        .lottery-list strong {
            display: block;
            color: var(--accent-light);
            font-size: 1.5rem; font-weight: 900;
            font-family: 'Inter';
            margin-bottom: 4px;
        }
        .lottery-list span { font-size: 0.85rem; color: rgba(255,255,255,0.75); }

        /* ===== Medal Showcase ===== */
        .medal-section {
            background: linear-gradient(180deg, #F1EFE9 0%, #E5E2D8 100%);
            position: relative;
            overflow: hidden;
        }
        .medal-section::before {
            content: '';
            position: absolute;
            top: -100px; right: -100px;
            width: 500px; height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46,125,50,0.08), transparent 70%);
        }
        .medal-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        .medal-visual {
            position: relative;
            aspect-ratio: 1;
            display: grid; place-items: center;
        }
        .medal-visual::before {
            content: '';
            position: absolute;
            width: 80%; height: 80%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46,125,50,0.18) 0%, transparent 65%);
            filter: blur(40px);
            animation: glow 4s ease-in-out infinite;
        }
        @keyframes glow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        .medal-img {
            position: relative;
            width: 78%;
            max-width: 460px;
            filter: drop-shadow(0 30px 50px rgba(14,20,16,0.35));
            animation: floatMedal 5s ease-in-out infinite;
            transform-origin: top center;
        }
        @keyframes floatMedal {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-14px) rotate(2deg); }
        }
        .medal-info h2 { font-size: clamp(2rem, 3.6vw, 2.8rem); }
        .medal-specs {
            margin-top: 36px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .medal-spec {
            padding: 20px;
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(20,24,26,0.06);
            border-radius: 14px;
            backdrop-filter: blur(10px);
        }
        .medal-spec dt {
            font-size: 0.72rem; font-weight: 700;
            color: var(--accent-dark);
            text-transform: uppercase; letter-spacing: 0.15em;
            margin-bottom: 6px;
        }
        .medal-spec dd { font-size: 1rem; font-weight: 700; color: var(--text); }
        .medal-tag {
            display: inline-block;
            padding: 6px 14px;
            background: var(--accent);
            color: #fff;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* ===== Gallery ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .gallery-item {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 4/5;
            cursor: pointer;
            background-color: #1E2620;
        }
        .gallery-item .gallery-bg {
            position: absolute; inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.7s var(--ease);
        }
        .gallery-item::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, transparent 30%, rgba(14,20,16,0.85) 100%);
        }
        .gallery-item:hover .gallery-bg { transform: scale(1.06); }
        .gallery-quote {
            position: absolute;
            left: 28px; right: 28px; bottom: 28px;
            color: #fff; font-weight: 600;
            font-size: 1.02rem; line-height: 1.5;
            z-index: 2;
        }
        .gallery-quote span {
            display: block;
            font-size: 0.78rem; font-weight: 500;
            color: var(--accent-glow);
            margin-bottom: 10px;
            letter-spacing: 0.1em;
        }

        /* ===== CTA ===== */
        .cta-banner {
            position: relative;
            overflow: hidden;
            border-radius: var(--radius-lg);
            padding: clamp(60px, 8vw, 100px) clamp(32px, 6vw, 80px);
            background:
                radial-gradient(ellipse at 80% 20%, rgba(165, 214, 167, 0.22), transparent 60%),
                linear-gradient(135deg, #0E1410 0%, #1B5E20 100%);
            color: #fff;
            display: flex; justify-content: space-between;
            align-items: center; gap: 40px; flex-wrap: wrap;
        }
        .cta-banner h2 {
            font-size: clamp(1.6rem, 3.2vw, 2.5rem);
            font-weight: 900; line-height: 1.18;
            letter-spacing: -0.02em;
        }
        .cta-banner h2 em { font-style: italic; color: var(--accent-light); }
        .cta-banner p { margin-top: 12px; color: rgba(255,255,255,0.72); }

        /* ===== FAQ ===== */
        .faq-list { max-width: 820px; margin: 0 auto; }
        .faq-item { border-bottom: 1px solid var(--line-dark); }
        .faq-q {
            width: 100%; text-align: left;
            padding: 26px 0;
            font-size: 1.05rem; font-weight: 700;
            display: flex; justify-content: space-between;
            align-items: center; gap: 20px;
            color: var(--text);
            transition: color 0.3s;
        }
        .faq-q:hover { color: var(--accent); }
        .faq-q .ico {
            width: 28px; height: 28px;
            display: grid; place-items: center;
            border: 1px solid var(--line-dark);
            border-radius: 50%;
            font-size: 1rem;
            transition: all 0.3s var(--ease);
            flex-shrink: 0;
        }
        .faq-item.open .faq-q .ico {
            transform: rotate(45deg);
            background: var(--accent); color: #fff;
            border-color: var(--accent);
        }
        .faq-a { max-height: 0; overflow: hidden; transition: max-height 0.5s var(--ease); }
        .faq-a-inner {
            padding: 0 0 26px;
            color: var(--text-soft);
            line-height: 1.75; max-width: 92%;
        }

        /* ===== Footer ===== */
        .footer { background: var(--bg); color: rgba(255,255,255,0.65); padding: 80px 0 40px; }
        .footer-top {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 40px;
            padding-bottom: 50px;
            border-bottom: 1px solid var(--line);
        }
        .footer h4 {
            color: #fff; font-size: 0.82rem;
            text-transform: uppercase; letter-spacing: 0.15em;
            margin-bottom: 20px; font-weight: 700;
        }
        .footer ul { list-style: none; }
        .footer ul li { margin-bottom: 10px; font-size: 0.92rem; }
        .footer ul a:hover { color: var(--accent-light); }
        .footer-brand p { margin-top: 16px; font-size: 0.92rem; max-width: 320px; }
        .footer-bottom {
            margin-top: 40px;
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 16px;
            font-size: 0.82rem; color: var(--text-mute);
        }
        .socials { display: flex; gap: 12px; }
        .socials a {
            width: 38px; height: 38px;
            border-radius: 50%;
            border: 1px solid var(--line);
            display: grid; place-items: center;
            transition: all 0.3s;
            color: rgba(255,255,255,0.7);
            font-size: 0.78rem; font-weight: 700;
        }
        .socials a:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
            color: var(--bg);
        }

        /* ===== Reveal ===== */
        .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }
        .reveal.in { opacity: 1; transform: none; }

        /* ===== Responsive ===== */
        @media (max-width: 1280px) {
            .stop-popup { width: 380px; }
        }
        @media (max-width: 1024px) {
            .stop-popup { width: 340px; }
        }
        @media (max-width: 960px) {
            .course-hero { grid-template-columns: 1fr; gap: 40px; }
            .course-visual { aspect-ratio: 16/10; position: relative; top: 0; }
            .awards { grid-template-columns: 1fr; }
            .lottery { grid-template-columns: 1fr; gap: 24px; }
            .gallery { grid-template-columns: 1fr; }
            .gallery-item { aspect-ratio: 16/10; }
            .footer-top { grid-template-columns: 1fr 1fr; }
            .medal-grid { grid-template-columns: 1fr; gap: 50px; text-align: center; }
            .medal-specs { max-width: 460px; margin-left: auto; margin-right: auto; }

            .stop-popup {
                position: relative;
                left: 0; top: 0;
                transform: none;
                width: 100%;
                max-width: 420px;
                margin-top: 14px;
                margin-left: -56px;
                margin-bottom: 4px;
                display: none;
            }
            .stop-popup::before { display: none; }
            .route li.show-popup .stop-popup { display: block; opacity: 1; }
        }
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .nav {
                position: fixed;
                top: 0; right: -100%;
                width: 80%; max-width: 320px;
                height: 100vh;
                background: var(--bg);
                flex-direction: column;
                align-items: flex-start; justify-content: center;
                gap: 28px; padding: 40px;
                transition: right 0.4s var(--ease);
                box-shadow: -10px 0 40px rgba(0,0,0,0.3);
            }
            .nav.open { right: 0; }
            .nav a { font-size: 1.3rem; font-weight: 700; }
            .cta-banner { text-align: center; }
            .cta-banner > div:first-child { flex: 1 1 100%; }
            .footer-top { grid-template-columns: 1fr; gap: 32px; }
            .lottery-list { grid-template-columns: 1fr; }
            .medal-specs { grid-template-columns: 1fr; }
            .countdown { gap: 8px; }
            .countdown-item { min-width: 0; padding: 18px 8px; }
            .countdown-sep { display: none; }
        }
        @media (max-width: 480px) {
            .btn { padding: 14px 24px; font-size: 0.95rem; }
            .info-card, .award-card, .lottery { padding: 28px; }
            .countdown-num { font-size: clamp(2.2rem, 13vw, 3.4rem); }
            .awards-hero { aspect-ratio: 4/3; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .reveal { opacity: 1; transform: none; }
        }
    </style>
</head>
<body>

    <header class="header" id="header">
        <div class="container header-inner">
            <a href="#" class="logo" aria-label="에코랜드 도르라 트레일 런 홈">
