                    <p class="section-desc">고객 동선이 아닌 자연 그대로의 곶자왈 숲을 달리는 이색 트레일 런 이벤트. 출발과 도착이 동일한 위치에서 진행되어 동반 가족과의 추억까지 함께 쌓을 수 있습니다.</p>
                </div>
                <div class="info-grid">
                    <div class="info-card reveal">
                        <div class="info-icon">📅</div>
