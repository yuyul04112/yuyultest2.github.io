                    <h2 class="section-title">단 하나의 코스, <em>9개의 풍경</em>.</h2>
                    <p class="section-desc">풋티풋티에서 출발해 곶자왈 원시림과 삼다정원, 호텔과 목장길을 거쳐 다시 출발지로 돌아오는 단일 8K 코스. 각 체크포인트에 마우스를 올려 미리 풍경을 확인해 보세요.</p>
