                    <span>2026.06.20 SAT · 09:00 · 제주 에코랜드</span>
                </div>
                <div class="hero-eyebrow">2026 ECOLAND SPECIAL EVENT · 제2회</div>
                <h1>곶자왈 숲을<br><em>도르라.</em></h1>
                <div class="hero-sub">‘도르라’ — 달리다 라는 의미의 제주 방언</div>
                <p class="lead">에코랜드에서만 경험할 수 있는 이색 트레일 러닝. 제주 곶자왈의 원시림을 가르며, 바람과 리듬, 그리고 고요함이 말을 거는 8km의 여정을 시작하세요.</p>
                <div class="hero-cta">
                    <a href="https://example.com/register" target="_blank" rel="noopener" class="btn btn-primary">
