    <script>
        /* ===== 이미지 자동 로더 (확장자 폴백) =====
           data-img="runners" 처럼 지정하면 runners.jpg → .jpeg → .png → .webp 순으로 시도해
           가장 먼저 로드되는 파일을 background-image 로 적용합니다. */
        (function () {
            const EXTS = ['jpg', 'jpeg', 'png', 'webp'];
            const tryLoad = (name) => new Promise((resolve) => {
                let i = 0;
                const next = () => {
                    if (i >= EXTS.length) return resolve(null);
                    const url = `${name}.${EXTS[i++]}`;
                    const img = new Image();
                    img.onload = () => resolve(url);
                    img.onerror = next;
                    img.src = url;
                };
                next();
            });
            document.querySelectorAll('[data-img]').forEach(async (el) => {
                const name = el.dataset.img;
                if (!name) return;
                const url = await tryLoad(name);
                if (url) {
                    el.style.backgroundImage = `url('${url}')`;
                } else {
                    console.warn(`[image] '${name}.{jpg,jpeg,png,webp}' 파일을 찾을 수 없습니다.`);
                }
            });
        })();

        // Header scroll
        const header = document.getElementById('header');
        const onScroll = () => header.classList.toggle('scrolled', window.scrollY > 30);
        document.addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        // Mobile menu
        const toggle = document.getElementById('menuToggle');
        const nav = document.getElementById('nav');
        toggle.addEventListener('click', () => {
            const open = nav.classList.toggle('open');
            toggle.classList.toggle('active', open);
            toggle.setAttribute('aria-expanded', open);
        });
        nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
            nav.classList.remove('open');
            toggle.classList.remove('active');
        }));

        // Countdown — 2026.06.20 09:00 KST
        (function () {
            const target = new Date('2026-06-20T09:00:00+09:00').getTime();
            const $d = document.querySelector('[data-d]');
            const $h = document.querySelector('[data-h]');
            const $m = document.querySelector('[data-m]');
            const $s = document.querySelector('[data-s]');
            const pad = n => String(n).padStart(2, '0');
            const setVal = (el, v) => {
                if (el.textContent !== v) {
                    el.textContent = v;
                    el.classList.remove('flip');
                    void el.offsetWidth;
                    el.classList.add('flip');
                }
            };
            const tick = () => {
                const diff = target - Date.now();
                if (diff <= 0) { [$d,$h,$m,$s].forEach(el => el.textContent = '00'); return; }
                setVal($d, pad(Math.floor(diff / 86400000)));
                setVal($h, pad(Math.floor(diff / 3600000) % 24));
                setVal($m, pad(Math.floor(diff / 60000) % 60));
                setVal($s, pad(Math.floor(diff / 1000) % 60));
            };
            tick(); setInterval(tick, 1000);
        })();

        // Reveal on scroll
        const io = new IntersectionObserver((entries) => {
            entries.forEach(e => {
                if (e.isIntersecting) {
                    e.target.classList.add('in');
                    io.unobserve(e.target);
                }
            });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(el => io.observe(el));

        // FAQ
        document.querySelectorAll('.faq-item').forEach(item => {
            const q = item.querySelector('.faq-q');
            const a = item.querySelector('.faq-a');
            q.addEventListener('click', () => {
                const open = item.classList.toggle('open');
                q.setAttribute('aria-expanded', open);
                a.style.maxHeight = open ? a.scrollHeight + 'px' : '0';
            });
        });

        // Course route — mobile tap toggle
        const isTouch = window.matchMedia('(hover: none)').matches;
        document.querySelectorAll('#route li').forEach(li => {
            li.addEventListener('click', () => {
                if (!isTouch) return;
                document.querySelectorAll('#route li').forEach(o => {
                    if (o !== li) o.classList.remove('show-popup');
                });
                li.classList.toggle('show-popup');
            });
        });
    </script>
